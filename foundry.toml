[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
cbor_metadata = false
ffi = false
# test/Manifest.t.sol reads launch.json to keep it in agreement with the source
fs_permissions = [{ access = "read", path = "./launch.json" }]

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[fmt]
line_length = 110
